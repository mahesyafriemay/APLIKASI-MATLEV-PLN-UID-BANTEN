name: Keep Streamlit Awake

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-jammy
    steps:
      - name: Install Playwright
        run: npm init -y && npm i playwright@1.49.0

      - name: Create script
        run: |
          cat > wake.js <<'SCRIPT'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto(process.env.APP_URL, { waitUntil: 'networkidle', timeout: 90000 });
            await page.waitForTimeout(8000);

            const btn = page.getByRole('button', { name: /get this app back up/i });
            try {
              await btn.waitFor({ timeout: 15000 });
              console.log('>> App TIDUR. Klik tombol wake...');
              await btn.click();
              await page.waitForTimeout(90000);
              console.log('>> Selesai nunggu boot.');
            } catch (e) {
              console.log('>> Tombol wake tidak ditemukan (app kemungkinan sudah hidup).');
            }

            await page.waitForTimeout(20000);
            const body = await page.innerText('body');
            console.log('--- ISI HALAMAN (300 char) ---');
            console.log(body.slice(0, 300));
            console.log('--- STATUS:', body.includes('Zzzz') ? 'MASIH TIDUR' : 'HIDUP', '---');
            await browser.close();
          })();
          SCRIPT
          cat wake.js

      - name: Wake the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: node wake.js
